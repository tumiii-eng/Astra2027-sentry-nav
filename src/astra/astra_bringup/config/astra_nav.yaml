sim_world_node:
  ros__parameters:
    update_rate_hz: 20.0
    point_rate_hz: 10.0
    goal_x: 5.0
    goal_y: 2.4
    max_range: 8.0
    obstacle_height: 0.8

batch_liwo_proxy_node:
  ros__parameters:
    input_odom_topic: /sim/odom
    output_odom_topic: /astra/odom

occupancy_node:
  ros__parameters:
    point_topic: /points
    odom_topic: /astra/odom
    obstacle_grid_topic: /astra/obstacle_grid
    map_frame: odom
    resolution: 0.1
    size_x: 10.0
    size_y: 10.0
    size_z: 1.2
    z_min: -0.15
    log_odds_hit: 0.85
    log_odds_miss: -0.35
    occupied_threshold: 0.6
    fade_ticks: 35
    max_points_per_update: 2500
    height_obstacle_min: 0.18
    column_occupancy_min: 0.18

planner_node:
  ros__parameters:
    odom_topic: /astra/odom
    obstacle_grid_topic: /astra/obstacle_grid
    goal_topic: /goal_pose
    path_topic: /astra/trajectory
    map_frame: odom
    # 连续代价场膨胀（对齐 HWSentryNav26 map_server global_map.inflation）。
    # 没有 robot_radius/safety_margin 了：机器人在连续代价场里是一个质点，
    # full_cost_radius_m 就是硬阻断半径（需覆盖车体半径），cutoff_radius_m 内是软代价。
    inflation.full_cost_radius_m: 0.1
    inflation.cutoff_radius_m: 0.3
    inflation.decay_rate_per_m: 24.0
    # 动态障碍层独立膨胀参数（对齐上游 local_map.inflation）。
    dynamic_inflation.full_cost_radius_m: 0.2
    dynamic_inflation.cutoff_radius_m: 0.4
    dynamic_inflation.decay_rate_per_m: 16.0
    # 对齐上游 capability_profiles.yaml 的 "medium" 档（mpc.follow.capability 用的就是它）：
    # command_envelope.velocity.max = 2.2, command_dynamics.velocity_rate_max = 2.0。
    # 上游 path_planner.yaml 的 velocity_max(3.0) 是几何塑形用的宽包络，真正约束速度剖面的
    # 是 capability，故这里取 capability 的值。
    max_velocity: 2.2
    max_acceleration: 2.0
    waypoint_spacing: 0.35
    dynamic_time_scaling_enabled: true
    dynamic_time_scaling_max_iterations: 4
    dynamic_time_scaling_safety_ratio: 1.03
    replan_rate_hz: 5.0
    obstacle_cost_radius: 0.55
    # 端点 BFS 重定位半径（对齐上游 path_planner endpoint nudge）。
    endpoint_nudge_max_distance: 1.0
    # 空间 A* 前端（对齐上游 spatial_a_star）。
    spatial_a_star.obstacle_weight: 1.0
    spatial_a_star.max_expansions: 1000000
    replan_start_position_inheritance_enabled: true
    replan_start_max_position_error: 0.18
    replan_start_transition_enabled: true
    replan_start_transition_max_position_error: 0.36
    short_path_hold_distance: 0.25
    start_projection_escape_enabled: true
    start_projection_escape_min_distance: 0.28
    start_projection_escape_speed: 0.25
    replan_strategy_enabled: true
    replan_goal_change_threshold: 0.5
    replan_optimize_only_enabled: true
    replan_partial_enabled: true
    replan_collision_clearance: 0.05
    replan_localization_deviation_threshold: 0.6
    replan_good_tracking_threshold: 0.25

controller_node:
  ros__parameters:
    odom_topic: /astra/odom
    path_topic: /astra/trajectory
    cmd_vel_topic: /cmd_vel
    control_rate_hz: 50.0
    # 线速度上限与 planner_node.max_velocity 同源（上游跟随器的 ṡ 上界与速度剖面优化
    # 用的是同一个 capability.command_envelope.velocity.max）。高于规划值等于在结构上
    # 允许控制器跑出轨迹，是"冲出轨迹"的直接来源，故 1.8→1.5。
    # 与 planner_node.max_velocity 严格相等（上游 medium 档 velocity.max = 2.2）。
    max_linear_velocity: 2.2
    max_angular_velocity: 2.5
    # 位置误差在参考点切/法向上分解后分别回正（上游 follow.tracking_weights.contour/lag，
    # 上游默认等权 1.6）。替代旧的单一 position_kp——旧实现把误差取自"当前时刻+前瞻时间"
    # 的参考点，1.5 m/s 下天生带 ~0.27 m 误差，乘 kp 变成常态超速指令。
    contour_kp: 1.4
    lag_kp: 1.4
    heading_kp: 2.2
    # velocity_damping 阻尼【切向投影速度超出参考速度的部分】(kd)，对应上游 residual(3)
    # (projected_velocity − path_speed_cmd)。只压超速不助加速，终点 v_ref→0 时自然刹车。
    velocity_damping: 0.6
    path_heading_tracking_enabled: false
    heading_startup_ramp_time: 0.8
    heading_error_deadband: 0.03
    heading_control_min_reference_speed: 0.05
    # 到达判定双判据（上游 path_executor.misc.stop_threshold_dist 与
    # stop_threshold_remaining_distance）：终点距离与剩余弧长须同时满足。
    # 不再用参考速度做判据——速度剖面在急弯处也会低速，会被误判为到达。
    arrival_position_tolerance: 0.18
    arrival_remaining_distance_tolerance: 0.18
    # 须 >= planner_node.max_acceleration(2.0)，否则控制器跟不上轨迹加速段并积累纵向滞后。
    # 上游速度剖面的 acceleration_upper 与跟随器的 ṡ 速率上界是同一个
    # capability.command_dynamics.velocity_rate_max(2.0)，故这里取相等。
    linear_command_accel_limit: 2.0
    angular_command_accel_limit: 2.0
    startup_velocity_error_grace_time: 0.6
    # 轨迹终点移动超过该距离才算新的跟随任务并重计渐入宽限。
    # 之前渐入判定挂在"单条轨迹发布时刻"上，5 Hz 重规划让它全程为真，把真正的超速 WARN 掩盖成 INFO。
    new_task_goal_distance: 0.5
    tracking_log_period_ms: 1000
    # —— (s, ṡ) 有向进度观测器（对齐 HWSentryNav26 task_manager.route_tracker）——
    # 参考点不再按"轨迹发布以来的墙钟时间"取，而是由位置+地图系速度矢量共同观测出的
    # 弧长进度换算得到，并保证进度单调不减；多假设竞争让错误分支被后续观测淘汰。
    route_tracking_enabled: true
    route_tracker.initial_search_distance: 0.5   # 新轨迹只允许在起点附近建立初始进度 (m)
    route_tracker.max_tracking_error: 2.0        # 与参考点距离超过此值判为跟踪丢失 (m)
    route_tracker.prediction_time_limit: 0.2     # 状态掉帧后最多积分这么久的路径速度 (s)
    route_tracker.hypothesis_spacing: 0.05       # 进度候选弧长间距 (m)
    route_tracker.max_hypotheses: 6              # 同时保留的竞争分支上限
    route_tracker.hypothesis_prune_ratio: 3.0    # 代价超过领先假设该比例裕度的分支被淘汰
    route_tracker.position_sigma: 0.20           # 位置观测标准差 (m)
    route_tracker.velocity_sigma: 0.30           # 地图系速度矢量观测标准差 (m/s)
    route_tracker.progress_sigma: 0.15           # 梯形积分进度模型标准差 (m)
    route_tracker.profile_speed_sigma: 0.80      # 规划速度弱先验标准差 (m/s)
    route_tracker.speed_dynamics_sigma: 0.30     # 路径速度帧间动态标准差 (m/s)
    tracking_error_warn_threshold: 0.35
    tracking_velocity_error_warn_threshold: 0.35
    mpc_preview_enabled: true
    mpc_preview_steps: 12
    mpc_preview_dt: 0.05
    mpc_preview_error_warn_threshold: 0.35
    # —— 报告 5.5.5 SE(2) MPC-QP 控制器（四全向轮全向底盘）——
    # controller_type: preview=预瞄原型（默认，兼容旧行为）；mpc=报告 5.5.5 MPC-QP。
    # 切换为 mpc 即启用稠密 QP（qpOASES）轨迹跟踪控制器。
    controller_type: preview
    # 预测时域：步数 × 步长。报告称 40 步时平均 1ms 内完成求解。
    mpc_horizon: 40
    mpc_dt: 0.05
    # 机器人物理参数（待用户按实车标定）。
    mpc_mass: 15.0            # 总质量 m (kg)
    mpc_inertia: 0.6         # 绕 Z 轴转动惯量 Iz (kg·m^2)
    # 状态误差权重 Q（待标定）。
    mpc_weight_position: 12.0 # 位置 px,py
    mpc_weight_yaw: 2.0       # 航向 θ
    mpc_weight_velocity: 1.0  # 速度 vx,vy
    mpc_weight_omega: 0.2     # 角速度 ω
    # 控制输入权重 R（待标定）。
    mpc_weight_force: 0.02    # 力 Fx,Fy
    mpc_weight_torque: 0.05   # 力矩 Mz
    # 运动学/动力学约束（待标定）。
    mpc_max_velocity: 2.0     # |vx|,|vy| 上限 (m/s)
    mpc_max_omega: 2.5        # |ω| 上限 (rad/s)
    mpc_max_force: 60.0       # |Fx|,|Fy| 上限 (N)
    mpc_max_torque: 20.0      # |Mz| 上限 (N·m)
    mpc_friction_coefficient: 0.8  # 摩擦系数 μ（摩擦圆 |F|≤μmg）
    mpc_gravity: 9.81
    mpc_friction_polygon_sides: 8  # 摩擦圆多边形线性化边数
    # 二次期望轨迹（报告 5.5.5.4.3 横向误差优先）。
    mpc_secondary_pass_enabled: true
    mpc_secondary_min_scale: 0.3   # 时间步最小缩放比，越小越偏重横向精度
    # 输出前瞻（报告 5.5.5.4.4：取 10ms 前瞻速度补偿延迟）。
    mpc_command_lookahead_time: 0.01
    # 启动速度下限（报告 5.5.5.6 变通方法，默认 0=关闭）。
    mpc_startup_speed_floor: 0.0
    # 到达保持判定。
    mpc_arrival_position_tolerance: 0.18
    mpc_arrival_speed_tolerance: 0.05
    # qpOASES 工作集重计算上限 nWSR。
    mpc_max_nwsr: 200

