sim_world_node:
  ros__parameters:
    scenario_name: 起点近障碍
    obstacle_layout: near_start
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0
    motion_enabled: true
    goal_x: 4.2
    goal_y: 2.0

planner_node:
  ros__parameters:
    # 起点埋在障碍里时靠 endpoint_nudge 的 BFS 重定位救回，半径给宽一些。
    endpoint_nudge_max_distance: 1.5

