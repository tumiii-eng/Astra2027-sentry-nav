sim_world_node:
  ros__parameters:
    scenario_name: 目标近障碍
    obstacle_layout: goal_near_obstacle
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0
    motion_enabled: true
    goal_x: 4.6
    goal_y: 1.25

planner_node:
  ros__parameters:
    # 目标点埋在障碍里时靠 endpoint_nudge 的 BFS 重定位救回，半径给宽一些。
    endpoint_nudge_max_distance: 1.5

